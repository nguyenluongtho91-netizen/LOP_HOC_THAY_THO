<!DOCTYPE html>
<html lang="vi">
  
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lớp Thầy Thọ" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lớp Học Thầy Thọ – Hệ thống học tập</title>
    <meta name="description" content="Lớp Học Thầy Thọ - Hệ thống học tập và thi trực tuyến" />
    <meta property="og:title" content="Lớp Học Thầy Thọ – Hệ thống học tập" />
    <meta property="og:description" content="Cổng thi và hệ thống học tập Lớp Học Thầy Thọ" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lophocthaytho.vercel.app" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Lexend:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        startup: {
          typeset: false // Tắt tự động vẽ, để Component MathText tự điều khiển
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message : '';
        if (msg.indexOf('dynamically imported module') !== -1 ||
            msg.indexOf('Expected a JavaScript module') !== -1 ||
            msg.indexOf('Loading chunk') !== -1) {
          var key = '__app_reload_guard__';
          var last = parseInt(sessionStorage.getItem(key) || '0', 10);
          if (Date.now() - last > 5000) {
            sessionStorage.setItem(key, Date.now().toString());
            window.location.reload();
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; text-align: center; color: #0f766e;">
        <div style="width: 44px; height: 44px; border: 4px solid #ccfbf1; border-top-color: #0d9488; border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-weight: 800; font-size: 18px; margin-bottom: 6px; letter-spacing: -0.02em;">LỚP HỌC THẦY THỌ</div>
        <div style="font-size: 13px; color: #0d9488; margin-bottom: 18px; font-weight: 600;">Đang khởi động cổng học tập...</div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
          <a href="/hoa12" style="background: linear-gradient(135deg, #4f46e5, #3730a3); color: #ffffff; padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 13px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);">🧪 Vào Đề Hóa 12</a>
          <button onclick="window.location.reload()" style="background: #ffffff; color: #0f766e; border: 1.5px solid #99f6e4; padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer;">Tải lại trang</button>
        </div>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
